name: daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run radar pipeline
        run: uv run radar run --site-dir site
        env:
          RADAR_LLM_API_KEY: ${{ secrets.RADAR_LLM_API_KEY }}
          RADAR_LLM_BASE_URL: ${{ secrets.RADAR_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          RADAR_LLM_MODEL: ${{ secrets.RADAR_LLM_MODEL || 'gpt-4o-mini' }}
          RADAR_LLM_SESSION_ID: ${{ secrets.RADAR_LLM_SESSION_ID || github.run_id }}

      - name: Prune registry
        run: uv run radar prune || true

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git add -A data/
          git add data/registry.json
          if ! git diff --quiet --cached; then
            git commit -m "chore(data): daily radar run"
            git push
          fi

      - name: Trigger deploy
        run: gh workflow run pages-deploy.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
