name: llm-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Call configured LLM provider
        env:
          RADAR_LLM_API_KEY: ${{ secrets.RADAR_LLM_API_KEY }}
          RADAR_LLM_BASE_URL: ${{ secrets.RADAR_LLM_BASE_URL }}
          RADAR_LLM_MODEL: ${{ secrets.RADAR_LLM_MODEL }}
          RADAR_LLM_SESSION_ID: ${{ secrets.RADAR_LLM_SESSION_ID || github.run_id }}
        run: |
          uv run python - <<'PY'
          import logging, os
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")

          from radar.enrich import enrich
          from radar.schema import Item

          item = Item(
              id="itm-ci-smoke",
              source="press_rss",
              url="https://example.com/ci-smoke",
              title="Unitree Go2 robot vulnerability allows remote takeover",
              body=(
                  "Researchers found that an attacker on the same Wi-Fi network can send "
                  "commands to a Unitree Go2 quadruped robot. The vendor has not released "
                  "a patch. CVSS:9.8. CVE-2026-99999 was assigned."
              ),
              published="2026-10-01",
          )

          enrich(
              [item],
              os.environ["RADAR_LLM_BASE_URL"],
              os.environ["RADAR_LLM_MODEL"],
              os.environ["RADAR_LLM_API_KEY"],
          )

          print("PROVIDER", os.environ["RADAR_LLM_BASE_URL"])
          print("MODEL", os.environ["RADAR_LLM_MODEL"])
          print("RELEVANT", item.ai_relevant)
          print("CATEGORY", item.ai_category)
          print("VENDOR", item.ai_vendor)
          print("SEVERITY", item.ai_severity)
          print("SUMMARY_LEN", len(item.ai_summary or ""))

          if item.ai_relevant is not True or not item.ai_summary:
              raise SystemExit("LLM smoke failed: item was not enriched")
          PY
